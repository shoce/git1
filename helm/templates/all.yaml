
{{- define "git1.SelectorLabels" -}}
app.kubernetes.io/name: "{{$.Chart.Name}}"
app.kubernetes.io/instance: "{{$.Release.Name}}"
{{- end -}}

{{- define "git1.Labels" -}}
helm.sh/chart: "{{$.Chart.Name}}-{{$.Chart.Version}}"
{{ include "git1.SelectorLabels" $ }}
{{- end -}}


{{- if $.Values.Service.Enabled }}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "git1"
  labels:
    {{- include "git1.Labels" $ | nindent 4 }}
spec:
  type: "{{$.Values.Service.Type}}"
  selector:
    {{- include "git1.SelectorLabels" $ | nindent 4 }}
  ports:
    - name: "ssh"
      port: {{ $.Values.Service.Port }}
      targetPort: "ssh"
      protocol: "TCP"
      {{- if and (eq $.Values.Service.Type "NodePort") $.Values.Service.NodePort }}
      nodePort: {{$.Values.Service.NodePort}}
      {{- end}}
{{- end}}


---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "git1"
  labels:
    {{- include "git1.Labels" $ | nindent 4 }}
type: "Opaque"
stringData:
  SshAuthorizedKeys: {{ join "\n" $.Values.SshAuthorizedKeys | quote }}


---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "git1"
  labels:
    {{- include "git1.Labels" $ | nindent 4 }}
    
spec:

  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      {{- include "git1.SelectorLabels" $ | nindent 6 }}
      
  template:
  
    metadata:
      labels:
        {{- include "git1.SelectorLabels" $ | nindent 8 }}
      annotations:
        image: "{{$.Values.ImageNameGithubGit1}}:{{$.Values.ImageTagGithubGit1}}"
        checksum/values: "{{ $.Values | toJson | sha256sum }}"
    spec:
      {{- with $.Values.ImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      
      containers:
        
        - name: "git1"
          image: "{{$.Values.ImageNameGithubGit1}}:{{$.Values.ImageTagGithubGit1}}"
          imagePullPolicy: "{{$.Values.ImagePullPolicy}}"
          
          ports:
            - name: "ssh"
              containerPort: 22
              protocol: "TCP"
              {{- if gt (default 0 $.Values.HostPort) 0 }}
              hostPort: {{$.Values.HostPort}}
              {{- end}}
              
          env:
            - name: "GIT1VERSION"
              value: "{{$.Values.ImageTagGithubGit1}}"
            - name: "SshAuthorizedKeys"
              valueFrom:
                secretKeyRef:
                  name: "git1"
                  key: "SshAuthorizedKeys"
            - name: "GitRepos"
              value: {{ join " " $.Values.GitRepos | quote }}
            - name: "GitHttpSslVerify"
              value: "{{$.Values.GitHttpSslVerify}}"
          
          livenessProbe:
            tcpSocket:
              port: "ssh"
            periodSeconds: 111
            
          volumeMounts:
            - name: "git1"
              mountPath: "{{$.Values.HomeDir}}"
              
          {{- with $.Values.Resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end}}
          
      volumes:
        - name: "git1"
          hostPath:
            path: "{{$.Values.HostPath}}"
            type: "DirectoryOrCreate"
      
      {{- with $.Values.NodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      
      {{- with $.Values.Tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      
      {{- with $.Values.Affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end}}



