
{{- define "git1.fullname" -}}
git1
{{- end -}}

{{- define "git1.selectorLabels" -}}
app.kubernetes.io/name: "{{ $.Chart.Name }}"
app.kubernetes.io/instance: "{{ $.Release.Name }}"
{{- end -}}

{{- define "git1.labels" -}}
helm.sh/chart: "{{ $.Chart.Name }}-{{ $.Chart.Version }}"
{{ include "git1.selectorLabels" $ }}
{{- end -}}


{{- if $.Values.service.enabled }}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ include "git1.fullname" $ }}"
  labels:
    {{- include "git1.labels" $ | nindent 4 }}
spec:
  type: "{{ $.Values.service.type }}"
  selector:
    {{- include "git1.selectorLabels" $ | nindent 4 }}
  ports:
    - name: "ssh"
      port: {{ $.Values.service.port }}
      targetPort: "ssh"
      protocol: "TCP"
      {{- if and (eq $.Values.service.type "NodePort") $.Values.service.nodePort }}
      nodePort: {{ $.Values.service.nodePort }}
      {{- end }}
{{- end }}


---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "{{ include "git1.fullname" $ }}"
  labels:
    {{- include "git1.labels" $ | nindent 4 }}
type: "Opaque"
stringData:
  SSH_AUTHORIZED_KEYS: {{ join "\n" $.Values.AuthorizedKeys | quote }}


---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "{{ include "git1.fullname" $ }}"
  labels:
    {{- include "git1.labels" $ | nindent 4 }}
    
spec:

  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      {{- include "git1.selectorLabels" $ | nindent 6 }}
      
  template:
  
    metadata:
      labels:
        {{- include "git1.selectorLabels" $ | nindent 8 }}
      annotations:
        checksum/values: "{{ $.Values | toJson | sha256sum }}"
    spec:
      {{- with $.Values.ImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
        
        - name: "git1"
          image: "{{ $.Values.ImageNameGithubGit1 }}:{{ $.Values.ImageTagGithubGit1 }}"
          imagePullPolicy: "{{ $.Values.ImagePullPolicy }}"
          
          ports:
            - name: "ssh"
              containerPort: 22
              protocol: "TCP"
              {{- if $.Values.hostPort.enabled }}
              hostPort: {{ $.Values.hostPort.port }}
              {{- end }}
              
          env:
            - name: "SSH_AUTHORIZED_KEYS"
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Values.existingSecret | default (include "git1.fullname" $) }}"
                  key: "SSH_AUTHORIZED_KEYS"
          
          livenessProbe:
            tcpSocket:
              port: "ssh"
            periodSeconds: 111
            
          volumeMounts:
            - name: "git1"
              mountPath: "/git1"
              
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
      volumes:
        - name: "git1"
          hostPath:
            path: "{{ $.Values.persistence.hostPath }}"
            type: "{{ $.Values.persistence.hostPathType }}"
      
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}


