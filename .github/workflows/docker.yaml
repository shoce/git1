name: "docker"

on:
  push:
    branches: ["main"]
    paths: ["flake.nix", "flake.lock", ".github/workflows/docker.yaml"]
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"

jobs:

  build:
    
    strategy:
      matrix:
        include:
          - arch: a"md64"
            runner: "ubuntu-24.04"
          - arch: "arm64"
            runner: "ubuntu-24.04-arm"
      
    runs-on: ${{ matrix.runner }}
    
    permissions:
      contents: "read"
      packages: "write"
      
    steps:
    
      - uses: "actions/checkout@v4"

      - uses: "cachix/install-nix-action@v31"

      - name: "image name"
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: "nix build"
        run: "nix build .#default --print-build-logs"

      - uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "load tag push"
        run: |
          docker load -i result
          docker tag "git1:latest" "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker push "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"


  manifest:
    
    needs: "build"
    runs-on: "ubuntu-24.04"
    permissions:
      packages: "write"
      
    steps:
    
      - name: "image name"
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "multi-arch manifest"
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA::12}" 
            "${IMAGE}:${GITHUB_SHA::12}-amd64" \
            "${IMAGE}:${GITHUB_SHA::12}-arm64" 


