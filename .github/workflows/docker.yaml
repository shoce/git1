
# docker.yaml

name: "docker"

on:
  push:
    branches:
      - "main"
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/docker.yaml"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"

jobs:

  imageversion:
  
    runs-on: "ubuntu-24.04"
    outputs:
      IMAGE: "${{steps.output.outputs.IMAGE}}"
      VERSION: "${{steps.output.outputs.VERSION}}"
    steps:
      - id: "image"
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: "version"
        uses: "shoce/action-version@v1"
      - id: "output"
        run: |
          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
  
  build:
    
    needs: "imageversion"
    
    strategy:
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-24.04"
          - arch: "arm64"
            runner: "ubuntu-24.04-arm"
      
    runs-on: ${{matrix.runner}}
    
    permissions:
      contents: "read"
      packages: "write"
    
    env:
      IMAGE: "${{needs.imageversion.outputs.IMAGE}}"
      VERSION: "${{needs.imageversion.outputs.VERSION}}"
    
    steps:
      
      - uses: "actions/checkout@v7"

      - uses: "cachix/install-nix-action@v31"

      - name: "nix build"
        run: "nix build .#default --print-build-logs"

      - uses: "docker/login-action@v4"
        with:
          registry: "${{env.REGISTRY}}"
          username: "${{github.actor}}"
          password: "${{secrets.GITHUB_TOKEN}}"

      - name: "load tag push"
        run: |
          docker load -i result
          docker tag "git1:latest" "${IMAGE}/${{matrix.arch}}:${VERSION}"
          docker push "${IMAGE}/${{ matrix.arch }}:${VERSION}"


  manifest:
    
    needs:
      - "imageversion"
      - "build"
    
    runs-on: "ubuntu-24.04"
    permissions:
      packages: "write"
    
    env:
      IMAGE: "${{needs.imageversion.outputs.IMAGE}}"
      VERSION: "${{needs.imageversion.outputs.VERSION}}"
    
    steps:
      
      - uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: "multi-arch manifest"
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}/amd64:${VERSION}" "${IMAGE}/arm64:${VERSION}" 

      - name: "delete latest"
        uses: "jenskeiner/ghcr-container-repository-cleanup-action@v1"
        with:
          package: "${{github.event.repository.name}}"
          include-tags: "latest"
          token: "${{secrets.GITHUB_TOKEN}}"

